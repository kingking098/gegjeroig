<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد استریم</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1300px;
            background: #111b26;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #2a3a4a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        #browser-view {
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: #000;
            display: block;
            cursor: crosshair;
            border: 2px solid #00ff88;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
            align-items: center;
            justify-content: center;
        }
        .controls input {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            background: #0f1722;
            color: #fff;
            border: 1px solid #2a3a4a;
            font-size: 15px;
            outline: none;
        }
        .controls input:focus {
            border-color: #00ff88;
        }
        .controls button {
            padding: 12px 22px;
            border-radius: 12px;
            border: none;
            background: #00ff88;
            color: #0b0e14;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls button:hover {
            background: #00d973;
            transform: scale(1.03);
        }
        .status {
            margin-top: 15px;
            color: #8a9aa8;
            font-size: 14px;
            text-align: center;
        }
        .status .green { color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <img id="browser-view" alt="خروجی مرورگر" />

    <div class="controls">
        <input type="text" id="urlInput" placeholder="آدرس (مثلا google.com)" value="https://google.com" />
        <button onclick="goToUrl()">برو</button>
        <button onclick="sendKey('Enter')">↵ Enter</button>
        <button onclick="sendKey('Backspace')">⌫ Backspace</button>
        <button onclick="scrollPage(-150)">↑ بالا</button>
        <button onclick="scrollPage(150)">↓ پایین</button>
    </div>

    <div class="status" id="statusText">🟢 <span class="green">در حال اتصال به استریم...</span></div>
</div>

<script>
    const socket = io({ transports: ['websocket', 'polling'] });
    const img = document.getElementById('browser-view');
    const status = document.getElementById('statusText');

    socket.on('connect', () => {
        socket.emit('start-stream');
        status.innerHTML = '🟢 <span class="green">استریم فعال</span>';
    });

    socket.on('live-frame', (data) => {
        img.src = 'data:image/jpeg;base64,' + data;
    });

    socket.on('error', (msg) => {
        status.innerHTML = '🔴 خطا: ' + msg;
    });

    // کلیک روی تصویر
    img.addEventListener('click', (e) => {
        const rect = img.getBoundingClientRect();
        const scaleX = 1280 / rect.width;
        const scaleY = 720 / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        socket.emit('command', { type: 'click', x, y });
    });

    // تایپ با کیبورد
    document.addEventListener('keydown', (e) => {
        if (['Control', 'Shift', 'Alt', 'Meta', 'F12'].includes(e.key)) return;
        if (e.key === 'Enter') socket.emit('command', { type: 'keydown', text: 'Enter' });
        else if (e.key === 'Backspace') socket.emit('command', { type: 'keydown', text: 'Backspace' });
        else if (e.key.length === 1) socket.emit('command', { type: 'type', text: e.key });
    });

    function goToUrl() {
        const url = document.getElementById('urlInput').value.trim();
        if (url) socket.emit('command', { type: 'goto', url });
    }

    function sendKey(key) {
        socket.emit('command', { type: 'keydown', text: key });
    }

    function scrollPage(amount) {
        socket.emit('command', { type: 'scroll', text: amount });
    }
</script>

</body>
</html>
