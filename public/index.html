<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به کنترل‌کننده مرورگر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0b0e14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .login-box {
            background: #151e2a;
            padding: 45px 35px;
            border-radius: 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a3a4a;
            text-align: center;
            transition: 0.3s;
        }

        .login-box:hover {
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.05);
        }

        .login-box h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-box .sub {
            color: #8a9aa8;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #b0c4d8;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: #0f1722;
            border: 1px solid #2a3a4a;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: #00ff88;
            border: none;
            border-radius: 14px;
            color: #0b0e14;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #00d973;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.2);
        }

        .error-msg {
            background: rgba(255, 60, 60, 0.15);
            border: 1px solid rgba(255, 60, 60, 0.3);
            border-radius: 12px;
            padding: 10px;
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .footer {
            margin-top: 25px;
            color: #4a5a6a;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🚀 کنترل مرورگر</h1>
        <p class="sub">برای ورود، هر نام کاربری و رمزی قبول است</p>

        <form id="loginForm">
            <div class="input-group">
                <label>👤 نام کاربری</label>
                <input type="text" id="username" placeholder="admin" required />
            </div>
            <div class="input-group">
                <label>🔒 رمز عبور</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn-login">ورود به داشبورد</button>

            <div id="errorBox" class="error-msg">❌ اطلاعات وارد شده صحیح نیست!</div>
        </form>

        <div class="footer">پروژه استریم زنده مرورگر</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('errorBox');

            errorBox.classList.remove('show');

            if (!user || !pass) {
                errorBox.textContent = '❌ لطفاً هر دو فیلد را پر کنید!';
                errorBox.classList.add('show');
                return;
            }

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errorBox.textContent = '❌ نام کاربری یا رمز عبور اشتباه است!';
                    errorBox.classList.add('show');
                }
            } catch (err) {
                errorBox.textContent = '❌ خطا در ارتباط با سرور!';
                errorBox.classList.add('show');
            }
        });
    </script>

</body>
</html>
