<!DOCTYPE html>
<html>
<head><title>ورود</title></head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#111; color:#fff; flex-direction:column;">
    <h2>🚀 ورود به کنترل‌کننده مرورگر</h2>
    <input id="user" placeholder="نام کاربری (هر چیزی)" /><br/>
    <input id="pass" type="password" placeholder="رمز عبور (هر چیزی)" /><br/>
    <button onclick="login()" style="padding:10px 30px;margin-top:10px;background:#00ff88;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">ورود</button>
    <script>
        async function login() {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: document.getElementById('user').value, 
                    password: document.getElementById('pass').value 
                })
            });
            const data = await res.json();
            if(data.success) location.href = data.redirect;
            else alert('نام یا رمز اشتباه! (ولی هر چیزی قبوله)');
        }
    </script>
</body>
</html>
